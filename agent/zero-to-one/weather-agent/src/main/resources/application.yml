spring:
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      timeout: 45s
      max-retries: 0
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: 0
          max-tokens: 2048
          extra-body:
            thinking:
              type: disabled
      embedding:
        enabled: false
    retry:
      max-attempts: 1
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
  level:
    root: WARN
    example.weather: INFO
server:
  address: ${WEATHER_BIND_ADDRESS:127.0.0.1}
  port: ${WEATHER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
