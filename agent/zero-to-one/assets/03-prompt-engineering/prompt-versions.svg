<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1130" viewBox="0 0 1640 1130" role="img" aria-labelledby="title desc"><title id="title">三个提示词版本：按累计内容做对照</title><desc id="desc">basic 使用 BASE；rules 使用 BASE 加 RULES；examples 使用 BASE 加 RULES 加 EXAMPLES。三个版本是独立运行的累计实验方案，不是执行阶段，也不预设后者更好。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6e98"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#18334e} .mono{font-family:Consolas,'Microsoft YaHei',monospace} .secondary{fill:#526b83} .bold{font-weight:700}</style><rect width="1640" height="1130" fill="#f4f7fb"/>
<text x="52" y="72" font-size="41" class="bold" text-anchor="start">三个提示词版本：按累计内容做对照</text>
<text x="54" y="117" font-size="24" class="secondary" text-anchor="start">WeatherPrompts.of(mode) 的真实拼接关系；每条内容带展示相应常量的节选。</text>
<text x="52" y="177" font-size="26" class="bold" text-anchor="start">运行参数与组合</text>
<text x="338" y="177" font-size="27" class="bold" text-anchor="start">BASE · 共同边界</text>
<text x="764" y="177" font-size="27" class="bold" text-anchor="start">RULES · 流程与输出</text>
<text x="1190" y="177" font-size="27" class="bold" text-anchor="start">EXAMPLES · 处理示例</text>
<rect x="52" y="208" width="1536" height="229" rx="16" fill="#f6f9fc" stroke="#e2eaf2" stroke-width="1.7"/>
<rect x="52" y="471" width="1536" height="229" rx="16" fill="#f6f9fc" stroke="#e2eaf2" stroke-width="1.7"/>
<rect x="52" y="734" width="1536" height="229" rx="16" fill="#f6f9fc" stroke="#e2eaf2" stroke-width="1.7"/>
<text x="76" y="270" font-size="24" class="mono bold" text-anchor="start">--prompt=basic</text>
<text x="76" y="310" font-size="25" class="mono" text-anchor="start">BASE</text>
<rect x="316" y="218" width="404" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="338" y="264" font-size="20" class="" text-anchor="start">你是天气查询助手，</text>
<text x="338" y="298" font-size="20" class="" text-anchor="start">使用工具取得天气信息并回答用户。</text>
<text x="338" y="332" font-size="20" class="" text-anchor="start">用户未明确提供且无法确定的</text>
<text x="338" y="366" font-size="20" class="" text-anchor="start">地点需要追问；</text>
<text x="338" y="400" font-size="20" class="" text-anchor="start">服务失败不代表天气晴朗或没有降水。</text>
<text x="76" y="533" font-size="24" class="mono bold" text-anchor="start">--prompt=rules</text>
<text x="76" y="573" font-size="25" class="mono" text-anchor="start">BASE</text>
<text x="76" y="609" font-size="25" class="mono" text-anchor="start">+ RULES</text>
<rect x="316" y="481" width="404" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="338" y="527" font-size="20" class="" text-anchor="start">你是天气查询助手，</text>
<text x="338" y="561" font-size="20" class="" text-anchor="start">使用工具取得天气信息并回答用户。</text>
<text x="338" y="595" font-size="20" class="" text-anchor="start">用户未明确提供且无法确定的</text>
<text x="338" y="629" font-size="20" class="" text-anchor="start">地点需要追问；</text>
<text x="338" y="663" font-size="20" class="" text-anchor="start">服务失败不代表天气晴朗或没有降水。</text>
<rect x="742" y="481" width="404" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="764" y="527" font-size="21" class="" text-anchor="start">用 searchLocations 定位地点，</text>
<text x="764" y="561" font-size="21" class="" text-anchor="start">再用其实际 ID 调用 getWeather。</text>
<text x="764" y="595" font-size="21" class="" text-anchor="start">没有新信息需要获取时结束，</text>
<text x="764" y="629" font-size="21" class="" text-anchor="start">不重复查询来凑步骤。</text>
<text x="764" y="663" font-size="21" class="" text-anchor="start">无法完成时说明缺口。</text>
<text x="729" y="599" font-size="25" class="bold" text-anchor="middle">+</text>
<text x="76" y="796" font-size="22" class="mono bold" text-anchor="start">--prompt=examples</text>
<text x="76" y="837" font-size="25" class="mono" text-anchor="start">BASE</text>
<text x="76" y="873" font-size="25" class="mono" text-anchor="start">+ RULES</text>
<text x="76" y="909" font-size="25" class="mono" text-anchor="start">+ EXAMPLES</text>
<rect x="316" y="744" width="404" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="338" y="790" font-size="20" class="" text-anchor="start">你是天气查询助手，</text>
<text x="338" y="824" font-size="20" class="" text-anchor="start">使用工具取得天气信息并回答用户。</text>
<text x="338" y="858" font-size="20" class="" text-anchor="start">用户未明确提供且无法确定的</text>
<text x="338" y="892" font-size="20" class="" text-anchor="start">地点需要追问；</text>
<text x="338" y="926" font-size="20" class="" text-anchor="start">服务失败不代表天气晴朗或没有降水。</text>
<rect x="742" y="744" width="404" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="764" y="790" font-size="21" class="" text-anchor="start">用 searchLocations 定位地点，</text>
<text x="764" y="824" font-size="21" class="" text-anchor="start">再用其实际 ID 调用 getWeather。</text>
<text x="764" y="858" font-size="21" class="" text-anchor="start">没有新信息需要获取时结束，</text>
<text x="764" y="892" font-size="21" class="" text-anchor="start">不重复查询来凑步骤。</text>
<text x="764" y="926" font-size="21" class="" text-anchor="start">无法完成时说明缺口。</text>
<rect x="1168" y="744" width="420" height="213" rx="15" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="1190" y="789" font-size="22" class="" text-anchor="start">以下示例仅演示处理方式，</text>
<text x="1190" y="829" font-size="22" class="" text-anchor="start">不是本次天气事实：</text>
<text x="1190" y="869" font-size="22" class="" text-anchor="start">用户：明天出门需要带伞吗？</text>
<text x="1190" y="909" font-size="22" class="" text-anchor="start">助手：请补充要查询的城市。</text>
<text x="729" y="862" font-size="25" class="bold" text-anchor="middle">+</text>
<text x="1157" y="862" font-size="25" class="bold" text-anchor="middle">+</text>
<rect x="52" y="1000" width="1536" height="84" rx="15" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.7"/>
<text x="78" y="1038" font-size="25" class="bold" text-anchor="start">这是 3 个独立运行的累计对照方案，不是一次任务中的 3 个阶段；不预设 examples 的效果更好。</text>
<text x="78" y="1071" font-size="23" class="secondary" text-anchor="start">对照时保持问题、模型、工具与预算一致，并固定 --context=full。</text>
</svg>
