<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#a6b6cb}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#cbd5e1}.small{font-size:17px;fill:#a6b6cb}.num{font-size:16px;font-weight:700;fill:#22d3ee}.tag{font-size:16px;font-weight:700;fill:#5eead4}</style><rect width="1440" height="800" fill="#0f172a"/><rect width="1440" height="800" fill="url(#grid)"/><title id="title">天气案例：提示词、工具与结果各司其职</title><desc id="desc">示意一次带工具的问答；是否调用工具取决于应用配置与实际运行。</desc><text x="45" y="64" class="title" >天气案例：提示词、工具与结果各司其职</text><text x="45" y="101" class="subtitle" >示意一次带工具的问答；是否调用工具取决于应用配置与实际运行。</text><path d="M345 296L395 296" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M695 296L745 296" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1045 296L1095 296" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="215" width="300" height="175" rx="14" fill="#0f172a"/><rect x="45" y="215" width="300" height="175" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="65" y="246" class="num" >01</text><text x="65" y="282" class="heading" >用户请求</text><text x="65" y="317" class="small" >“北京明天要带伞吗？”</text><text x="65" y="346" class="small" >需要地点、日期和天气</text><rect x="395" y="215" width="300" height="175" rx="14" fill="#0f172a"/><rect x="395" y="215" width="300" height="175" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="415" y="246" class="num" >02</text><text x="415" y="282" class="heading" >模型选择工具</text><text x="415" y="317" class="small" >根据可用工具发起请求</text><text x="415" y="346" class="small" >生成参数，不等于已查到</text><rect x="745" y="215" width="300" height="175" rx="14" fill="#0f172a"/><rect x="745" y="215" width="300" height="175" rx="14" fill="#78350f" fill-opacity=".7" stroke="#fbbf24" stroke-width="2"/><text x="765" y="246" class="num" >03</text><text x="765" y="282" class="heading" >工具与应用</text><text x="765" y="317" class="small" >查询数据；校验地点、</text><text x="765" y="346" class="small" >时间、响应与异常</text><rect x="1095" y="215" width="300" height="175" rx="14" fill="#0f172a"/><rect x="1095" y="215" width="300" height="175" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="1115" y="246" class="num" >04</text><text x="1115" y="282" class="heading" >回填后组织回答</text><text x="1115" y="317" class="small" >依据返回数据给建议</text><text x="1115" y="346" class="small" >说明时间与数据来源</text><rect x="45" y="435" width="650" height="172" rx="14" fill="#152f2b" stroke="#34d399" stroke-width="2"/><rect x="745" y="435" width="650" height="172" rx="14" fill="#351d2c" stroke="#fb7185" stroke-width="2"/><text x="67" y="473" class="heading" >查询成功：真实结果回填</text><text x="67" y="511" class="body" >工具结果 → 作为新上下文交给模型</text><text x="67" y="545" class="body" >回答时核对日期、地点、降水与来源</text><text x="67" y="579" class="small" >天气示例为过程示意，不代表实际预报</text><text x="767" y="473" class="heading" >查询失败或结果不完整</text><text x="767" y="511" class="body" >明确说明未查到或信息不足</text><text x="767" y="545" class="body" >不把模拟结果、模型猜测当作实况</text><text x="767" y="579" class="small" >工具权限与参数校验由应用控制</text><path d="M895 390V410H370V425" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895 390V410H1070V425" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="698" class="small" >边界：提示词可说明何时查询、怎样回答；访问权限、工具执行和结果校验仍需应用保障。</text><text x="45" y="734" class="small" >天气随时间变化，最终应以实际工具返回及对应来源为准。</text></svg>