<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<defs><marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="violet-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="amber-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style>
<title id="title">天气 Agent：提示词、执行约束与结果证据</title><desc id="desc">当前实现通过 HTTP 提交问题，Java 调用高德预报工具，模型读取实际结果后组织候选。</desc>
<rect width="1440" height="900" fill="#f4f7fb" /><text x="45" y="64" class="title" text-anchor="start">天气 Agent：提示词、执行约束与结果证据</text><text x="45" y="102" class="subtitle" text-anchor="start">当前实现通过 HTTP 提交问题，Java 调用高德预报工具，模型读取实际结果后组织候选。</text>
<path d="M345 258H395" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M695 258H745" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M1045 258H1095" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><rect x="45" y="175" width="300" height="165" rx="14" fill="#ffffff" /><rect x="45" y="175" width="300" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="214" class="heading" text-anchor="start">用户 HTTP 请求</text><text x="67" y="253" class="small" text-anchor="start">本次城市与相对日期</text><text x="67" y="282" class="small code" text-anchor="start">POST /api/weather/ask</text><rect x="395" y="175" width="300" height="165" rx="14" fill="#ffffff" /><rect x="395" y="175" width="300" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="417" y="214" class="heading" text-anchor="start">模型提出工具请求</text><text x="417" y="253" class="tiny code" text-anchor="start">searchLocations → getWeather</text><text x="417" y="282" class="tiny" text-anchor="start">使用实际返回的地点 ID</text><rect x="745" y="175" width="300" height="165" rx="14" fill="#ffffff" /><rect x="745" y="175" width="300" height="165" rx="14" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.5" /><text x="767" y="214" class="heading" text-anchor="start">Java 预检并执行</text><text x="767" y="253" class="small" text-anchor="start">校验参数、地点和预算</text><text x="767" y="282" class="small" text-anchor="start">访问高德，保留实际结果</text><rect x="1095" y="175" width="300" height="165" rx="14" fill="#ffffff" /><rect x="1095" y="175" width="300" height="165" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="1117" y="214" class="heading" text-anchor="start">回填后生成候选</text><text x="1117" y="253" class="small" text-anchor="start">读取工具结果再回答</text><text x="1117" y="282" class="small" text-anchor="start">或说明本轮缺少什么</text><rect x="45" y="400" width="650" height="250" rx="14" fill="#ffffff" /><rect x="45" y="400" width="650" height="250" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="442" class="heading" text-anchor="start">查询成功：按字段引用预报</text><text x="67" y="484" class="body code" text-anchor="start">localTime 理解明天；daily[].date 匹配日期</text><text x="67" y="521" class="body" text-anchor="start">白天 / 夜间温度分别说明</text><text x="67" y="558" class="body code" text-anchor="start">precipitationProbability=null：概率未知</text><text x="67" y="602" class="small" text-anchor="start">标明高德来源；预报不等于实况</text><rect x="745" y="400" width="650" height="250" rx="14" fill="#ffffff" /><rect x="745" y="400" width="650" height="250" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="767" y="442" class="heading" text-anchor="start">缺失与失败：交付具体缺口</text><text x="767" y="484" class="body" text-anchor="start">城市不明先追问；目标日缺失就说明</text><text x="767" y="521" class="body" text-anchor="start">服务错误不代表晴天；null 不能填零</text><text x="767" y="558" class="body" text-anchor="start">预算由程序限制，足够回答就结束</text><text x="767" y="602" class="small" text-anchor="start">缺字段时保留其他有效信息</text><rect x="45" y="705" width="1350" height="105" rx="14" fill="#ffffff" /><rect x="45" y="705" width="1350" height="105" rx="14" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="746" class="heading" text-anchor="start">独立核验：同一次任务的工具结果 ↔ 候选回答</text><text x="67" y="784" class="small" text-anchor="start">HTTP 200 与 COMPLETED 不能单独证明正确；还要核对地点、日期、字段、未知值和来源。</text><text x="45" y="860" class="small" text-anchor="start">流程示意，不含实时预报；当前高德接口未提供降水概率，增加提示词不能补出真实数值。</text>
</svg>