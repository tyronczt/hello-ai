<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#a6b6cb}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#cbd5e1}.small{font-size:17px;fill:#a6b6cb}.num{font-size:16px;font-weight:700;fill:#22d3ee}.tag{font-size:16px;font-weight:700;fill:#5eead4}</style><rect width="1440" height="800" fill="#0f172a"/><rect width="1440" height="800" fill="url(#grid)"/><title id="title">Transformer 注意力：从上下文到下一 token</title><desc id="desc">decoder-only 架构的简化示意，展示因果遮罩、注意力和下一 token 的生成过程。</desc>
<text x="45" y="64" class="title">Transformer 注意力：从上下文到下一 token</text><text x="45" y="101" class="subtitle">decoder-only 简化示意：每个位置只能关注当前及更早的 token。</text>
<path d="M275 293H325" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 293H605" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 293H885" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1115 293H1165" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="210" width="230" height="170" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="65" y="242" class="num">01</text><text x="65" y="277" class="heading">输入表示</text><text x="65" y="312" class="small">token 编码与</text><text x="65" y="341" class="small">位置信息进入网络</text>
<rect x="325" y="210" width="230" height="170" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="345" y="242" class="num">02</text><text x="345" y="277" class="heading">计算 Q、K、V</text><text x="345" y="312" class="small">Q 与 K 算相关分数</text><text x="345" y="341" class="small">因果遮罩屏蔽未来位置</text>
<rect x="605" y="210" width="230" height="170" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="625" y="242" class="num">03</text><text x="625" y="277" class="heading">加权汇聚</text><text x="625" y="312" class="small">分数归一为注意力权重</text><text x="625" y="341" class="small">按权重汇聚 V 信息</text>
<rect x="885" y="210" width="230" height="170" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="905" y="242" class="num">04</text><text x="905" y="277" class="heading">多层变换</text><text x="905" y="312" class="small">多头注意力及前馈网络</text><text x="905" y="341" class="small">逐层更新表示</text>
<rect x="1165" y="210" width="230" height="170" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="1185" y="242" class="num">05</text><text x="1185" y="277" class="heading">预测并选择</text><text x="1185" y="312" class="small">logits 经 softmax 转概率</text><text x="1185" y="341" class="small">解码选择下一 token</text>
<path d="M1280 390V423H160V390" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#cyan)"/><text x="860" y="455" class="small">追加所选 token，继续预测</text>
<rect x="45" y="480" width="1350" height="175" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="68" y="518" class="heading">因果遮罩：预测时只能看已出现的内容</text><text x="68" y="557" class="body">分词示意：[帮我] → [分析] → [日志]　　下一位置：？（实际分词依模型而异）</text><text x="68" y="591" class="body">“日志”的表示可汇聚它之前及自身的信息；未生成的未来 token 不可见。</text><text x="68" y="627" class="small">Q / K / V 表示查询、键和值；注意力权重是计算量，不能直接当作完整解释或因果证明。</text>
<text x="45" y="731" class="small">为突出流程，图中省略残差、归一化及具体位置编码等细节；具体实现依模型而异。</text></svg>