<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style><rect width="1440" height="800" fill="#f4f7fb" /><title id="title">Transformer 注意力：从上下文到下一 Token</title><desc id="desc">decoder-only 架构的简化示意，展示因果遮罩、注意力和下一 Token 的生成过程。</desc>
<text x="45" y="64" class="title">Transformer 注意力：从上下文到下一 Token</text><text x="45" y="101" class="subtitle">decoder-only 简化示意：每个位置只能关注当前及更早的 Token。</text>
<path d="M275 293H325" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M555 293H605" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M835 293H885" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M1115 293H1165" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" />
<rect x="45" y="210" width="230" height="170" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="65" y="242" class="num">01</text><text x="65" y="277" class="heading">输入表示</text><text x="65" y="312" class="small">Token 编码与</text><text x="65" y="341" class="small">位置信息进入网络</text>
<rect x="325" y="210" width="230" height="170" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="345" y="242" class="num">02</text><text x="345" y="277" class="heading">计算 Q、K、V</text><text x="345" y="312" class="small">Q 与 K 算相关分数</text><text x="345" y="341" class="small">因果遮罩屏蔽未来位置</text>
<rect x="605" y="210" width="230" height="170" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="625" y="242" class="num">03</text><text x="625" y="277" class="heading">加权汇聚</text><text x="625" y="312" class="small">按位置分配注意力权重</text><text x="625" y="341" class="small">按权重汇聚 V 信息</text>
<rect x="885" y="210" width="230" height="170" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="905" y="242" class="num">04</text><text x="905" y="277" class="heading">多层变换</text><text x="905" y="312" class="small">多头注意力及前馈网络</text><text x="905" y="341" class="small">逐层更新表示</text>
<rect x="1165" y="210" width="230" height="170" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="1185" y="242" class="num">05</text><text x="1185" y="277" class="heading">预测并选择</text><text x="1185" y="312" class="small">logits 经 softmax 转概率</text><text x="1185" y="341" class="small">解码选择下一 Token</text>
<path d="M1280 390V423H160V390" fill="none" stroke="#3f6e98" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#cyan)" /><text x="860" y="455" class="small">追加所选 Token，继续预测</text>
<rect x="45" y="480" width="1350" height="175" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="68" y="518" class="heading">因果遮罩：预测时只能看已出现的内容</text><text x="68" y="557" class="body">分词示意：[总结] → [故障] → [报告]　　下一位置：？（实际分词依模型而异）</text><text x="68" y="591" class="body">“报告”的表示可汇聚它之前及自身的信息；未生成的未来 Token 不可见。</text><text x="68" y="627" class="small">Q / K / V 表示查询、键和值；注意力权重是计算量，不能直接当作完整解释或因果证明。</text>
<text x="45" y="731" class="small">为突出流程，图中省略残差、归一化及具体位置编码等细节；具体实现依模型而异。</text></svg>