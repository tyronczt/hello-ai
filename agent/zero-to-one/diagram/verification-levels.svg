<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<defs><marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="violet-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="amber-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style>
<title id="title">验证分三层：结构、行为与任务结果</title><desc id="desc">每项检查回答不同问题；通过一个层次，不自动代表其他层次也通过。</desc>
<rect width="1440" height="900" fill="#f4f7fb" /><text x="45" y="64" class="title" text-anchor="start">验证分三层：结构、行为与任务结果</text><text x="45" y="102" class="subtitle" text-anchor="start">每项检查回答不同问题；通过一个层次，不自动代表其他层次也通过。</text>
<rect x="45" y="170" width="420" height="335" rx="14" fill="#ffffff" /><rect x="45" y="170" width="420" height="335" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="209" class="heading" text-anchor="start">01  结构检查</text><text x="67" y="248" class="small" text-anchor="start">请求和响应字段、工具 Schema</text><text x="67" y="277" class="small" text-anchor="start">JSON 可解析；文档路径存在</text><text x="67" y="361" class="small" text-anchor="start">能证明：约定结构可用</text><text x="67" y="408" class="small" text-anchor="start">仍需检查：实际执行与事实</text><rect x="510" y="170" width="420" height="335" rx="14" fill="#ffffff" /><rect x="510" y="170" width="420" height="335" rx="14" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.5" /><text x="532" y="209" class="heading" text-anchor="start">02  行为检查</text><text x="532" y="248" class="small" text-anchor="start">缺城市先追问；ID 来自本次检索</text><text x="532" y="277" class="small" text-anchor="start">工具顺序、重复调用与预算</text><text x="532" y="361" class="small" text-anchor="start">能证明：本次路径符合要求</text><text x="532" y="408" class="small" text-anchor="start">仍需检查：答案字段与来源</text><rect x="975" y="170" width="420" height="335" rx="14" fill="#ffffff" /><rect x="975" y="170" width="420" height="335" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="997" y="209" class="heading" text-anchor="start">03  结果核验</text><text x="997" y="248" class="small" text-anchor="start">以同一任务 toolEvents 为证据</text><text x="997" y="277" class="small" text-anchor="start">核对日期、来源、字段与 null</text><text x="997" y="361" class="small" text-anchor="start">能证明：候选与本次证据一致</text><text x="997" y="408" class="small" text-anchor="start">仍不能保证：未来天气一定如此</text><text x="45" y="568" class="heading" text-anchor="start">把检查嵌入任务过程，并保留下一次能复核的证据：</text><path d="M345 656H395" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M695 656H745" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M1045 656H1095" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><rect x="45" y="610" width="300" height="125" rx="14" fill="#ffffff" /><rect x="45" y="610" width="300" height="125" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="649" class="heading" text-anchor="start">规则与本次任务</text><text x="67" y="688" class="tiny" text-anchor="start">明确来源、范围和完成条件</text><rect x="395" y="610" width="300" height="125" rx="14" fill="#ffffff" /><rect x="395" y="610" width="300" height="125" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="417" y="649" class="heading" text-anchor="start">模型与工具执行</text><text x="417" y="688" class="tiny" text-anchor="start">记录真实输入和调用结果</text><rect x="745" y="610" width="300" height="125" rx="14" fill="#ffffff" /><rect x="745" y="610" width="300" height="125" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="767" y="649" class="heading" text-anchor="start">独立核验</text><text x="767" y="688" class="tiny" text-anchor="start">逐层检查，缺证据就标明</text><rect x="1095" y="610" width="300" height="125" rx="14" fill="#ffffff" /><rect x="1095" y="610" width="300" height="125" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="1117" y="649" class="heading" text-anchor="start">保留证据、维护规则</text><text x="1117" y="688" class="tiny" text-anchor="start">复核过期路径与业务条件</text><rect x="45" y="780" width="1350" height="75" rx="14" fill="#ffffff" /><rect x="45" y="780" width="1350" height="75" rx="14" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="825" class="body" text-anchor="start">先明确检查对象，再写结论；缺少证据的层次标为未验证。</text>
</svg>