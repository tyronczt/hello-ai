<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#a6b6cb}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#cbd5e1}.small{font-size:17px;fill:#a6b6cb}.num{font-size:16px;font-weight:700;fill:#22d3ee}.tag{font-size:16px;font-weight:700;fill:#5eead4}</style><rect width="1440" height="800" fill="#0f172a"/><rect width="1440" height="800" fill="url(#grid)"/><title id="title">提示词如何影响下一段生成</title><desc id="desc">以下是简化示意：模型利用已有上下文预测下一个 token，再继续生成。</desc><text x="45" y="64" class="title" >提示词如何影响下一段生成</text><text x="45" y="101" class="subtitle" >以下是简化示意：模型利用已有上下文预测下一个 token，再继续生成。</text><path d="M275 293L325 293" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 293L605 293" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 293L885 293" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1115 293L1165 293" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="215" width="230" height="165" rx="14" fill="#0f172a"/><rect x="45" y="215" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="65" y="246" class="num" >01</text><text x="65" y="282" class="heading" >消息</text><text x="65" y="317" class="small" >系统与用户消息</text><text x="65" y="346" class="small" >与资料共同构成输入</text><rect x="325" y="215" width="230" height="165" rx="14" fill="#0f172a"/><rect x="325" y="215" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="345" y="246" class="num" >02</text><text x="345" y="282" class="heading" >分词</text><text x="345" y="317" class="small" >token 可以是词、</text><text x="345" y="346" class="small" >字的一部分或符号</text><rect x="605" y="215" width="230" height="165" rx="14" fill="#0f172a"/><rect x="605" y="215" width="230" height="165" rx="14" fill="#064e3b" fill-opacity=".7" stroke="#34d399" stroke-width="2"/><text x="625" y="246" class="num" >03</text><text x="625" y="282" class="heading" >模型计算</text><text x="625" y="317" class="small" >结合训练得到的</text><text x="625" y="346" class="small" >参数计算下一步</text><rect x="885" y="215" width="230" height="165" rx="14" fill="#0f172a"/><rect x="885" y="215" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="905" y="246" class="num" >04</text><text x="905" y="282" class="heading" >候选分布</text><text x="905" y="317" class="small" >不同上下文会改变</text><text x="905" y="346" class="small" >各候选的相对可能性</text><rect x="1165" y="215" width="230" height="165" rx="14" fill="#0f172a"/><rect x="1165" y="215" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="1185" y="246" class="num" >05</text><text x="1185" y="282" class="heading" >选择并追加</text><text x="1185" y="317" class="small" >追加到已有序列</text><text x="1185" y="346" class="small" >再预测下一个</text><path d="M1280 390V423H720V391" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#cyan)"/><text x="1000" y="450" class="small" >重复直到结束</text><rect x="45" y="482" width="1350" height="180" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="68" y="518" class="heading" >示意：补充任务背景会改变后续生成方向</text><text x="68" y="557" class="body" >输入 A：请解释“超时”  →  可能给出一般性定义</text><text x="68" y="591" class="body" >输入 B：结合以下订单日志解释“超时”  →  更可能围绕提供的日志回答</text><text x="68" y="628" class="small" >示例仅说明影响方向，不代表确定输出；模型可能选错，也可能生成无依据的内容。</text><text x="45" y="733" class="small" >提示词改变的是本次输入及生成条件，通常不会在这次对话中直接改写模型权重。</text></svg>