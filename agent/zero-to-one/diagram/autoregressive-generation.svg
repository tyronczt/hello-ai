<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style><rect width="1440" height="800" fill="#f4f7fb" /><title id="title">提示词怎样影响下一 Token 的生成</title><desc id="desc">以下是简化示意：模型利用已有上下文预测下一个 Token，再继续生成。</desc><text x="45" y="64" class="title">提示词怎样影响下一 Token 的生成</text><text x="45" y="101" class="subtitle">以下是简化示意：模型利用已有上下文预测下一个 Token，再继续生成。</text><path d="M275 293L325 293" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M555 293L605 293" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M835 293L885 293" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><path d="M1115 293L1165 293" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="215" width="230" height="165" rx="14" fill="#ffffff" /><rect x="45" y="215" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="65" y="246" class="num">01</text><text x="65" y="282" class="heading">本次输入</text><text x="65" y="317" class="small">规则、报告和问题</text><text x="65" y="346" class="small">共同构成本次输入</text><rect x="325" y="215" width="230" height="165" rx="14" fill="#ffffff" /><rect x="325" y="215" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="345" y="246" class="num">02</text><text x="345" y="282" class="heading">分词</text><text x="345" y="317" class="small">Token 可以是词、</text><text x="345" y="346" class="small">字的一部分或符号</text><rect x="605" y="215" width="230" height="165" rx="14" fill="#ffffff" /><rect x="605" y="215" width="230" height="165" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="625" y="246" class="num">03</text><text x="625" y="282" class="heading">模型计算</text><text x="625" y="317" class="small">结合训练得到的</text><text x="625" y="346" class="small">参数计算下一步</text><rect x="885" y="215" width="230" height="165" rx="14" fill="#ffffff" /><rect x="885" y="215" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="905" y="246" class="num">04</text><text x="905" y="282" class="heading">候选分布</text><text x="905" y="317" class="small">不同上下文会改变</text><text x="905" y="346" class="small">各候选的相对可能性</text><rect x="1165" y="215" width="230" height="165" rx="14" fill="#ffffff" /><rect x="1165" y="215" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="1185" y="246" class="num">05</text><text x="1185" y="282" class="heading">选择并追加</text><text x="1185" y="317" class="small">追加到已有序列</text><text x="1185" y="346" class="small">再预测下一个</text><path d="M1280 390V423H720V391" fill="none" stroke="#3f6e98" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#cyan)" /><text x="1000" y="450" class="small">重复直到结束</text><rect x="45" y="482" width="1350" height="180" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="68" y="518" class="heading">示意：补充缺失信息的处理规则，改变生成条件</text><text x="68" y="557" class="body">输入 A：总结报告 → 未限定恢复过程缺失时怎样写</text><text x="68" y="591" class="body">输入 B：总结报告；未提及项写“未提供” → 明确缺失信息的处理</text><text x="68" y="628" class="small">两段输入的规则不同，后续候选分布可能改变；实际输出仍要核对原报告。</text><text x="45" y="733" class="small">提示词改变的是本次输入及生成条件，通常不会在这次对话中直接改写模型权重。</text></svg>