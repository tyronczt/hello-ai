<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<defs><marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="violet-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="amber-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style>
<title id="title">任务契约：目标、边界、完成证据与停止条件</title><desc id="desc">以故障摘要说明目标、范围、核查方法和结束方式。</desc>
<rect width="1440" height="900" fill="#f4f7fb" /><text x="45" y="64" class="title" text-anchor="start">任务契约：目标、边界、完成证据与停止条件</text><text x="45" y="102" class="subtitle" text-anchor="start">以故障摘要说明目标、范围、核查方法和结束方式。</text>
<rect x="45" y="155" width="430" height="155" rx="14" fill="#ffffff" /><rect x="45" y="155" width="430" height="155" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="194" class="heading" text-anchor="start">目标</text><text x="67" y="233" class="small" text-anchor="start">产出 200 字内故障摘要</text><text x="67" y="262" class="small" text-anchor="start">聚焦一个主要结果</text><rect x="505" y="155" width="430" height="155" rx="14" fill="#ffffff" /><rect x="505" y="155" width="430" height="155" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="527" y="194" class="heading" text-anchor="start">材料</text><text x="527" y="233" class="small" text-anchor="start">读取本次原始报告</text><text x="527" y="262" class="small" text-anchor="start">明确材料和当前缺口</text><rect x="965" y="155" width="430" height="155" rx="14" fill="#ffffff" /><rect x="965" y="155" width="430" height="155" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="987" y="194" class="heading" text-anchor="start">约束</text><text x="987" y="233" class="small" text-anchor="start">保留原始时间与影响</text><text x="987" y="262" class="small" text-anchor="start">不补写事实，不修改报告</text><text x="45" y="355" class="small" text-anchor="start">先限定执行范围，再用完成条件和证据决定能否交付。</text><path d="M195 575V720H455" fill="none" stroke="#3f6e98" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#rose-arrow)" /><text x="67" y="615" class="small" text-anchor="start">缺少报告</text><path d="M345 469H455" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M900 469H1005" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#green-arrow)" /><text x="953" y="448" class="small" text-anchor="middle">满足</text><rect x="45" y="390" width="300" height="185" rx="14" fill="#ffffff" /><rect x="45" y="390" width="300" height="185" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="429" class="heading" text-anchor="start">执行本次任务</text><text x="67" y="468" class="small" text-anchor="start">按约定整理材料</text><text x="67" y="497" class="small" text-anchor="start">发现缺口时如实保留</text><rect x="455" y="390" width="445" height="185" rx="14" fill="#ffffff" /><rect x="455" y="390" width="445" height="185" rx="14" fill="#e7eff7" stroke="#b4c6d7" stroke-width="1.5" /><text x="477" y="429" class="heading" text-anchor="start">完成条件 + 验证</text><text x="477" y="468" class="small" text-anchor="start">完成条件：五项有依据或标明缺失</text><text x="477" y="497" class="small" text-anchor="start">核查方法：逐项对照原报告</text><text x="477" y="526" class="small" text-anchor="start">检查遗漏、推测和时间错位</text><rect x="1005" y="390" width="390" height="185" rx="14" fill="#ffffff" /><rect x="1005" y="390" width="390" height="185" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="1027" y="429" class="heading" text-anchor="start">交付</text><text x="1027" y="468" class="small" text-anchor="start">摘要与简短核对清单</text><text x="1027" y="497" class="small" text-anchor="start">证据可复核后再认定完成</text><path d="M677 575V650" fill="none" stroke="#3f6e98" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#rose-arrow)" /><text x="697" y="615" class="small" text-anchor="start">关键时间冲突</text><rect x="455" y="650" width="940" height="140" rx="14" fill="#ffffff" /><rect x="455" y="650" width="940" height="140" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="477" y="689" class="heading" text-anchor="start">停止条件</text><text x="477" y="730" class="body" text-anchor="start">请求补充报告；标明时间冲突并澄清。</text><text x="477" y="766" class="small" text-anchor="start">本轮可以交付缺口说明，但不能把原任务标为已完成。</text><text x="45" y="850" class="small" text-anchor="start">核查要回到原报告；缺少材料或发现关键冲突时，先澄清再继续。</text>
</svg>