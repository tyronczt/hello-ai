<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="violet-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="amber-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker><marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f6e98" /></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#18334e}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526b83}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#18334e}.small{font-size:17px;fill:#526b83}.tiny{font-size:15px;fill:#526b83}.label{font-size:19px;font-weight:600;fill:#18334e}.num{font-size:16px;font-weight:700;fill:#3f6e98}.tag{font-size:16px;font-weight:700;fill:#3f6e98}.code{font-family:'Consolas','Cascadia Mono','Microsoft YaHei',monospace;font-weight:500}</style>
<title id="title">把模糊要求变成可验证的提示词</title><desc id="desc">从故障摘要开始：任务、材料和结果检查逐步对应。</desc>
<rect width="1440" height="800" fill="#f4f7fb" /><text x="45" y="64" class="title" text-anchor="start">把模糊要求变成可验证的提示词</text><text x="45" y="102" class="subtitle" text-anchor="start">从故障摘要开始：任务、材料和结果检查逐步对应。</text>
<rect x="45" y="130" width="1350" height="73" rx="14" fill="#ffffff" /><rect x="45" y="130" width="1350" height="73" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="160" class="heading" text-anchor="start">起点：帮我总结故障</text><text x="67" y="188" class="small" text-anchor="start">先交代读者、材料、边界和交付，再对照原文检查。</text><path d="M275 303H325" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M555 303H605" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M835 303H885" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><path d="M1115 303H1165" fill="none" stroke="#3f6e98" stroke-width="2" marker-end="url(#slate-arrow)" /><rect x="45" y="225" width="230" height="165" rx="14" fill="#ffffff" /><rect x="45" y="225" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="264" class="heading" text-anchor="start">01  目标</text><text x="67" y="303" class="small" text-anchor="start">面向值班工程师</text><text x="67" y="332" class="small" text-anchor="start">保留故障关键信息</text><rect x="325" y="225" width="230" height="165" rx="14" fill="#ffffff" /><rect x="325" y="225" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="347" y="264" class="heading" text-anchor="start">02  材料</text><text x="347" y="303" class="small" text-anchor="start">本次原始报告</text><text x="347" y="332" class="small" text-anchor="start">明确已知与缺失项</text><rect x="605" y="225" width="230" height="165" rx="14" fill="#ffffff" /><rect x="605" y="225" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="627" y="264" class="heading" text-anchor="start">03  约束</text><text x="627" y="303" class="small" text-anchor="start">只依据原文</text><text x="627" y="332" class="small" text-anchor="start">缺失写“未提供”</text><rect x="885" y="225" width="230" height="165" rx="14" fill="#ffffff" /><rect x="885" y="225" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="907" y="264" class="heading" text-anchor="start">04  输出</text><text x="907" y="303" class="small" text-anchor="start">按五个部分组织</text><text x="907" y="332" class="small" text-anchor="start">摘要不超过 200 字</text><rect x="1165" y="225" width="230" height="165" rx="14" fill="#ffffff" /><rect x="1165" y="225" width="230" height="165" rx="14" fill="#ffffff" stroke="#b4c6d7" stroke-width="1.5" /><text x="1187" y="264" class="heading" text-anchor="start">05  核对</text><text x="1187" y="303" class="small" text-anchor="start">逐项对照原文</text><text x="1187" y="332" class="small" text-anchor="start">检查遗漏和推测</text><rect x="45" y="430" width="1350" height="230" rx="14" fill="#ffffff" /><rect x="45" y="430" width="1350" height="230" rx="14" fill="#f6f9fc" stroke="#b4c6d7" stroke-width="1.5" /><text x="67" y="470" class="heading" text-anchor="start">组合成一次请求</text><text x="67" y="513" class="body" text-anchor="start">请面向值班工程师总结下面的故障报告，按五个部分组织，摘要不超过 200 字。</text><text x="67" y="551" class="body" text-anchor="start">现象、影响范围、原因、恢复过程、待确认问题，都以本次报告为依据。</text><text x="67" y="589" class="body" text-anchor="start">没有提到的内容写“未提供”；生成后逐项与原文核对，避免猜测和时间错位。</text><text x="67" y="631" class="small" text-anchor="start">持续执行的任务，再补充明确的完成条件与停止条件。</text><text x="45" y="734" class="small" text-anchor="start">简单任务按需补充信息；标题、标签和更长的文本本身不保证效果。</text>
</svg>