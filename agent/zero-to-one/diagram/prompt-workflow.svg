<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker><marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#a6b6cb}.heading{font-size:23px;font-weight:700}.body{font-size:19px;fill:#cbd5e1}.small{font-size:17px;fill:#a6b6cb}.num{font-size:16px;font-weight:700;fill:#22d3ee}.tag{font-size:16px;font-weight:700;fill:#5eead4}</style><rect width="1440" height="800" fill="#0f172a"/><rect width="1440" height="800" fill="url(#grid)"/><title id="title">把模糊要求变成可验证的提示词</title><desc id="desc">从“帮我分析日志”出发：先补齐必要信息，再检查结果。</desc><text x="45" y="64" class="title" >把模糊要求变成可验证的提示词</text><text x="45" y="101" class="subtitle" >从“帮我分析日志”出发：先补齐必要信息，再检查结果。</text><rect x="45" y="128" width="1350" height="74" rx="12" fill="#1e293b" stroke="#64748b"/><text x="65" y="158" class="heading" >起点：帮我分析日志</text><text x="65" y="188" class="small" >模型还不知道分析对象、时间、期望结果以及什么才算有依据。</text><path d="M275 303L325 303" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 303L605 303" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 303L885 303" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1115 303L1165 303" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="225" width="230" height="165" rx="14" fill="#0f172a"/><rect x="45" y="225" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="65" y="256" class="num" >01</text><text x="65" y="292" class="heading" >目标</text><text x="65" y="327" class="small" >定位订单超时原因</text><text x="65" y="356" class="small" >而不是笼统“分析日志”</text><rect x="325" y="225" width="230" height="165" rx="14" fill="#0f172a"/><rect x="325" y="225" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="345" y="256" class="num" >02</text><text x="345" y="292" class="heading" >上下文</text><text x="345" y="327" class="small" >服务名、时间范围</text><text x="345" y="356" class="small" >脱敏日志与调用链</text><rect x="605" y="225" width="230" height="165" rx="14" fill="#0f172a"/><rect x="605" y="225" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="625" y="256" class="num" >03</text><text x="625" y="292" class="heading" >约束</text><text x="625" y="327" class="small" >只依据材料；缺数据</text><text x="625" y="356" class="small" >时标注未知，不要猜</text><rect x="885" y="225" width="230" height="165" rx="14" fill="#0f172a"/><rect x="885" y="225" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="905" y="256" class="num" >04</text><text x="905" y="292" class="heading" >输出</text><text x="905" y="327" class="small" >按现象、证据、推断</text><text x="905" y="356" class="small" >和下一步输出</text><rect x="1165" y="225" width="230" height="165" rx="14" fill="#0f172a"/><rect x="1165" y="225" width="230" height="165" rx="14" fill="#083344" fill-opacity=".7" stroke="#22d3ee" stroke-width="2"/><text x="1185" y="256" class="num" >05</text><text x="1185" y="292" class="heading" >校验</text><text x="1185" y="327" class="small" >核对日志与时间</text><text x="1185" y="356" class="small" >区分事实和推断</text><rect x="45" y="432" width="1350" height="230" rx="14" fill="#102639" stroke="#60a5fa" stroke-width="2"/><text x="67" y="468" class="heading" >组合成一次请求</text><text x="67" y="507" class="body" >请分析订单服务在 10:00—10:10 的超时日志，定位可能原因。</text><text x="67" y="542" class="body" >材料：以下是脱敏日志和调用链。仅依据材料，缺失信息请明确标注。</text><text x="67" y="577" class="body" >按“现象 → 日志证据 → 可能原因 → 下一步排查”输出，区分事实与推断。</text><text x="67" y="628" class="small" >结果不符合要求？先定位是信息不足、约束不清还是证据不匹配，再做针对性修改。</text><text x="45" y="733" class="small" >提示：简单问题不必机械套用所有字段；涉及事实时，提供真实资料并核验。</text></svg>